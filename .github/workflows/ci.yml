name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.9 `npm ci` rejects this lockfile (missing optional peer
      # @types/react@19.3.0). --legacy-peer-deps installs from the lockfile.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

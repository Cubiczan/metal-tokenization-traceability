[package]
name = "reserve-registry"
version = "0.1.0"
description = "MetalX - Reserve Registry for vault attestations"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reserve_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }

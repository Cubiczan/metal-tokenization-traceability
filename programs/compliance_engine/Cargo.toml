[package]
name = "compliance-engine"
version = "0.1.0"
description = "MetalX - KYC/AML Compliance Engine with transfer restrictions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "compliance_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }

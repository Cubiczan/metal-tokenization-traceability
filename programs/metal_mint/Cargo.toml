[package]
name = "metal-mint"
version = "0.1.0"
description = "MetalX - Metal Mint Program (SPL Token-2022)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "metal_mint"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token-2022"] }
